name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.4"

      - name: Setup Application
        run: bun run setup

      - name: Build Code
        run: bun run build

      - name: Run Tests
        run: bun run test
